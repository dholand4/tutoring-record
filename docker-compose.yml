services:
  tutoring-record:
    build: .
    container_name: tutoring-record
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HEADLESS=true
      - TZ=America/Fortaleza
      # true = executa uma vez ao subir o container (útil para testar o setup)
      - RUN_ON_START=${RUN_ON_START:-false}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    shm_size: "1gb"
