name: Cadastro Automático de Tutorias

on:
  schedule:
    # Segunda e Sexta: fim às 19:00 BRT → roda às 18:50 BRT (21:50 UTC)
    - cron: '50 21 * * 1,5'
    # Terça, Quarta e Quinta: fim às 17:30 BRT → roda às 17:20 BRT (20:20 UTC)
    - cron: '20 20 * * 2,3,4'
    # Sábado: fim às 12:00 BRT → roda às 11:50 BRT (14:50 UTC)
    - cron: '50 14 * * 6'
  workflow_dispatch: # permite execução manual pelo GitHub

permissions:
  contents: read

jobs:
  cadastrar-tutorias:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # rede de segurança: sem isso um job travado roda por 6h

    steps:
      # Diagnóstico: mostra em qual aba cada nome foi cadastrado e falha em 2s
      # se faltar algum. Imprime só "OK" ou "vazio" — nunca o valor.
      - name: Conferir secrets e variables
        env:
          S_MOODLE_USUARIO: ${{ secrets.MOODLE_USUARIO }}
          V_MOODLE_USUARIO: ${{ vars.MOODLE_USUARIO }}
          S_MOODLE_SENHA: ${{ secrets.MOODLE_SENHA }}
          V_MOODLE_SENHA: ${{ vars.MOODLE_SENHA }}
          S_AVA_USER_ID: ${{ secrets.AVA_USER_ID }}
          V_AVA_USER_ID: ${{ vars.AVA_USER_ID }}
          S_ATIVIDADES_URL: ${{ secrets.ATIVIDADES_URL }}
          V_ATIVIDADES_URL: ${{ vars.ATIVIDADES_URL }}
          S_AVA_SENHA: ${{ secrets.AVA_SENHA }}
          V_AVA_SENHA: ${{ vars.AVA_SENHA }}
        run: |
          faltando=""
          printf '%-16s | %-8s | %s\n' "NOME" "SECRETS" "VARIABLES"
          for nome in MOODLE_USUARIO MOODLE_SENHA AVA_USER_ID ATIVIDADES_URL AVA_SENHA; do
            s="S_$nome"; v="V_$nome"
            if [ -n "${!s}" ]; then sf="OK"; else sf="vazio"; fi
            if [ -n "${!v}" ]; then vf="OK"; else vf="vazio"; fi
            printf '%-16s | %-8s | %s\n' "$nome" "$sf" "$vf"
            if [ -z "${!s}" ] && [ "$nome" != "AVA_SENHA" ]; then faltando="$faltando $nome"; fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::Nao chegaram ao runner:$faltando"
            echo "Se a coluna VARIABLES estiver OK, foram cadastrados na aba errada — o workflow le da aba Secrets."
            exit 1
          fi

      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install chromium --with-deps

      - name: Executar cadastro de tutorias
        env:
          MOODLE_USUARIO: ${{ secrets.MOODLE_USUARIO }}
          MOODLE_SENHA: ${{ secrets.MOODLE_SENHA }}
          AVA_SENHA: ${{ secrets.AVA_SENHA }}
          AVA_USER_ID: ${{ secrets.AVA_USER_ID }}
          ATIVIDADES_URL: ${{ secrets.ATIVIDADES_URL }}
          HEADLESS: 'true'
          PERIODO_INICIO: ${{ vars.PERIODO_INICIO }}
          PERIODO_FIM: ${{ vars.PERIODO_FIM }}
        run: npm start

      # ATENÇÃO: em repositório público qualquer pessoa baixa os artefatos das
      # execuções. Só sobe o log de texto — nunca logs/session.json (cookies do
      # AVA autenticados), screenshots ou os dumps HTML de diagnóstico.
      - name: Salvar log em caso de falha
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-diagnostico
          path: logs/*.log
          retention-days: 7
          if-no-files-found: ignore
